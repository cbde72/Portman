[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portman-parsers"

version = "0.8.5"
description = "Independent, evidence-aware bank PDF parser contracts for Portman"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSES/EPL-1.0.txt", "NOTICE_COMDIRECT_PP.md"]
dependencies = ["pypdf>=6,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]
pdfium = ["pypdfium2>=4,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
